[workspace]
members = [
    "crates/core",
    "crates/reader-markdown",
    "crates/reader-chatgpt",
    "crates/reader-claude",
    "crates/writer-ump",
    "crates/writer-okf",
    "crates/cli",
]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.58", default-features = false }
anyhow = "1"
sha2 = "0.11"
data-encoding = "2"
serde_jcs = "0.2"
serde-saphyr = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
regex = "1"
toml = "1"
mem-adaptor-core = { path = "crates/core" }
mem-adaptor-reader-markdown = { path = "crates/reader-markdown" }
mem-adaptor-reader-chatgpt = { path = "crates/reader-chatgpt" }
mem-adaptor-reader-claude = { path = "crates/reader-claude" }
mem-adaptor-writer-ump = { path = "crates/writer-ump" }
mem-adaptor-writer-okf = { path = "crates/writer-okf" }
