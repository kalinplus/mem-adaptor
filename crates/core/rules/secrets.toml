# Local boundary adjustment: punctuation terminates supported OpenAI/Anthropic tokens;
# token-alphabet characters must not permit matching a prefix of a longer token.

[[rules]]
id = "anthropic-api-key"
regex = '''\b(sk-ant-api03-[a-zA-Z0-9_\-]{93}AA)(?:[^A-Za-z0-9_-]|$)'''
secret_group = 1

[[rules]]
id = "aws-access-token"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
secret_group = 1

[[rules]]
id = "github-fine-grained-pat"
regex = '''github_pat_\w{82}'''
secret_group = 0

[[rules]]
id = "github-pat"
regex = '''ghp_[0-9a-zA-Z]{36}'''
secret_group = 0

[[rules]]
id = "openai-api-key"
regex = '''\b(sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})|sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20})(?:[^A-Za-z0-9_-]|$)'''
secret_group = 1

[[rules]]
id = "private-key"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S-]{64,}?KEY(?: BLOCK)?-----'''
secret_group = 0

# Local rule, not from Gitleaks. Detect the assigned value, not the variable name.
[[rules]]
id = "password-assignment"
regex = '''(?i)\bpassword\s*[:=]\s*["']?([^\s"'`;]{8,})'''
secret_group = 1
